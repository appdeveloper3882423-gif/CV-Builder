<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dashboard — CVBuilder</title>
<style>
:root{--p:#2563eb;--ink:#0f172a;--muted:#64748b;--bg:#f8fafc;--card:#fff;--b:#e2e8f0}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:var(--bg)}button{font:inherit;cursor:pointer}.wrap{width:min(1160px,calc(100% - 28px));margin:auto}.top{background:#fff;border-bottom:1px solid var(--b);height:72px}.topin{height:100%;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850;font-size:20px;color:var(--ink);text-decoration:none;display:flex;gap:9px;align-items:center}.mark{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:var(--p);color:#fff;font-size:12px}.actions{display:flex;gap:9px}.quick-actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:750}.primary{background:var(--p);color:#fff}.ghost{background:#fff;border:1px solid var(--b);color:var(--ink)}main{padding:38px 0}.welcome{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}.welcome h1{margin:0;font-size:31px}.welcome p{color:var(--muted);margin:4px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:30px}.stat{background:#fff;border:1px solid var(--b);border-radius:16px;padding:20px}.stat span{color:var(--muted);font-size:13px}.stat strong{display:block;font-size:29px;margin-top:6px}.panel{background:#fff;border:1px solid var(--b);border-radius:18px;padding:23px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.panel h2{margin:0;font-size:20px}.cvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.cvcard{border:1px solid var(--b);border-radius:14px;padding:18px}.cvcard h3{margin:0 0 5px}.cvcard p{margin:0 0 12px;color:var(--muted);font-size:13px}.tag{display:inline-block;background:#eff6ff;color:#1d4ed8;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:750}.cardactions{display:flex;gap:8px;margin-top:15px}.small{padding:8px 10px;font-size:12px}.empty{text-align:center;padding:55px 20px;color:var(--muted)}.loading{text-align:center;padding:35px;color:var(--muted)}.toast{position:fixed;right:18px;bottom:18px;background:#0f172a;color:#fff;padding:12px 16px;border-radius:10px;display:none}.toast.show{display:block}@media(max-width:800px){.cvgrid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:560px){.welcome{align-items:flex-start;flex-direction:column}.cvgrid,.stats{grid-template-columns:1fr}.actions .ghost{display:none}.quick-actions{width:100%}.quick-actions .btn{flex:1}}
</style></head>
<body>
<header class="top"><div class="wrap topin"><a class="brand" href="dashboard.html"><span class="mark">CV</span>CVBuilder</a><div class="actions"><button class="btn ghost" id="myProfile">Profile</button><button class="btn ghost" id="logoutButton">Logout</button></div></div></header>
<main class="wrap">
<section class="welcome"><div><h1>Welcome back, <span id="welcomeName">there</span></h1><p id="userEmail">Loading account...</p></div><div class="quick-actions"><button class="btn ghost" id="atsButton">ATS Checker</button><button class="btn ghost" id="tailorButton">Tailor for Job</button><button class="btn primary" id="createNewCV">+ Create New CV</button></div></section>
<section class="stats"><div class="stat"><span>Total CVs</span><strong id="totalCVs">0</strong></div><div class="stat"><span>Completed CVs</span><strong id="completedCVs">0</strong></div><div class="stat"><span>Account</span><strong id="accountStatus">Active</strong></div></section>
<section class="panel"><div class="panelhead"><h2>My CVs</h2></div><div id="loadingState" class="loading">Loading your CVs...</div><div id="savedCVs" class="cvgrid"></div><div id="emptyState" class="empty" style="display:none"><h3>No CVs yet</h3><p>Create your first professional CV and it will appear here.</p><button class="btn primary" id="emptyCreateButton">Create My First CV</button></div></section>
</main>
<div class="toast" id="dashboardToast"></div>
<script type="module">
import {auth,db} from "./firebase-config.js";
import {onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {collection,getDocs,deleteDoc,doc,query,orderBy} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const $=id=>document.getElementById(id);let currentUser=null;
function toast(t){$("dashboardToast").textContent=t;$("dashboardToast").classList.add("show");setTimeout(()=>$("dashboardToast").classList.remove("show"),2200)}
function cleanData(d){const x={...d};delete x.createdAt;delete x.updatedAt;return x}
function card(id,d){
 const title=d.professionalTitle||d.role||"Professional CV";const role=d.role||"General Professional";
 const el=document.createElement("article");el.className="cvcard";
 el.innerHTML=`<span class="tag">${d.category||"Professional"}</span><h3>${escapeHtml(title)}</h3><p>${escapeHtml(role)} · ${escapeHtml(d.template||"Professional")}</p><small>Updated ${d.updatedAt?.toDate?d.updatedAt.toDate().toLocaleDateString():new Date(d.updatedAt||Date.now()).toLocaleDateString()}</small><div class="cardactions"><button class="btn primary small edit">Edit</button><button class="btn ghost small delete">Delete</button></div>`;
 el.querySelector(".edit").onclick=()=>{localStorage.setItem("currentCV",JSON.stringify({...cleanData(d),firestoreId:id}));localStorage.setItem("selectedCVCategory",d.category||"Other");localStorage.setItem("selectedCVRole",d.role||"General Professional");localStorage.setItem("selectedCVTemplate",d.template||"classic");location.href="cv-form.html"};
 el.querySelector(".delete").onclick=async()=>{if(!confirm("Delete this CV permanently?"))return;await deleteDoc(doc(db,"users",currentUser.uid,"cvs",id));toast("CV deleted");loadCVs()};
 return el;
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function loadCVs(){
 $("loadingState").style.display="block";$("savedCVs").innerHTML="";$("emptyState").style.display="none";
 let snap;try{snap=await getDocs(query(collection(db,"users",currentUser.uid,"cvs"),orderBy("updatedAt","desc")))}catch(e){snap=await getDocs(collection(db,"users",currentUser.uid,"cvs"))}
 $("loadingState").style.display="none";const docs=snap.docs.map(x=>({id:x.id,data:x.data()}));
 $("totalCVs").textContent=docs.length;$("completedCVs").textContent=docs.length;
 if(!docs.length){$("emptyState").style.display="block";return}
 docs.sort((a,b)=>String(b.data.updatedAt||"").localeCompare(String(a.data.updatedAt||"")));
 docs.forEach(x=>$("savedCVs").appendChild(card(x.id,x.data)));
}
$("atsButton").onclick=()=>location.href="ats-checker.html";$("tailorButton").onclick=()=>location.href="job-tailor.html";
$("createNewCV").onclick=()=>{localStorage.removeItem("currentCV");localStorage.removeItem("selectedCVCategory");localStorage.removeItem("selectedCVRole");localStorage.removeItem("selectedCVTemplate");location.href="templates.html"};
$("emptyCreateButton").onclick=$("createNewCV").onclick;
$("logoutButton").onclick=async()=>{await signOut(auth);location.href="index.html"};
onAuthStateChanged(auth,user=>{if(!user){location.href="index.html";return}currentUser=user;$("userEmail").textContent=user.email||"Google account";$("welcomeName").textContent=user.displayName?.split(" ")[0]||user.email?.split("@")[0]||"there";loadCVs()});
</script></body></html>
