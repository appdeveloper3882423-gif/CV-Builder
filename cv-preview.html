<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Preview | CVBuilder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef2f7;
      color: #172033;
    }

    button {
      font-family: inherit;
    }

    .topbar {
      height: 70px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
      color: #172033;
    }

    .brand span {
      color: #2563eb;
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .action-btn {
      height: 40px;
      border: 1px solid #dbe2ea;
      background: #ffffff;
      color: #334155;
      padding: 0 15px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .action-btn:hover {
      border-color: #2563eb;
      color: #2563eb;
    }

    .action-btn.primary {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    .action-btn.primary:hover {
      background: #1d4ed8;
    }

    .page-wrapper {
      max-width: 1250px;
      margin: 0 auto;
      padding: 35px 20px 70px;
    }

    .page-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .page-heading h1 {
      margin: 0 0 6px;
      font-size: 27px;
      color: #0f172a;
    }

    .page-heading p {
      margin: 0;
      color: #64748b;
      font-size: 14px;
    }

    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge {
      padding: 7px 11px;
      background: #ffffff;
      border: 1px solid #dbe2ea;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
    }

    .status {
      display: none;
      margin-bottom: 18px;
      padding: 12px 15px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    .status.error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .cv-stage {
      overflow-x: auto;
      padding: 10px 5px 40px;
    }

    #cvDocument {
      width: 794px;
      min-height: 1123px;
      margin: 0 auto;
      background: #ffffff;
      box-shadow: 0 20px 55px rgba(15, 23, 42, 0.15);
      position: relative;
      overflow: hidden;
    }

    /* =========================
       BASE CV
    ========================= */

    .cv-content {
      padding: 48px 52px;
    }

    .cv-header {
      padding-bottom: 23px;
      border-bottom: 1px solid #dbe2ea;
    }

    .cv-name {
      margin: 0;
      font-size: 34px;
      line-height: 1.05;
      letter-spacing: -0.8px;
      color: #0f172a;
      font-weight: 800;
    }

    .cv-title {
      margin-top: 9px;
      font-size: 16px;
      color: #2563eb;
      font-weight: 700;
    }

    .contact-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 16px;
      color: #475569;
      font-size: 11px;
    }

    .contact-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .contact-icon {
      color: #2563eb;
      font-weight: 700;
    }

    .section {
      margin-top: 25px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .section-heading h2 {
      margin: 0;
      color: #0f172a;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 800;
    }

    .section-line {
      height: 1px;
      background: #dbe2ea;
      flex: 1;
    }

    .summary {
      color: #475569;
      font-size: 11.5px;
      line-height: 1.75;
    }

    .experience-item,
    .education-item {
      margin-bottom: 17px;
    }

    .experience-item:last-child,
    .education-item:last-child {
      margin-bottom: 0;
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .item-title {
      margin: 0;
      font-size: 13px;
      color: #0f172a;
      font-weight: 800;
    }

    .item-company {
      margin-top: 4px;
      color: #2563eb;
      font-size: 11px;
      font-weight: 700;
    }

    .item-date {
      color: #64748b;
      font-size: 10px;
      white-space: nowrap;
      font-weight: 600;
    }

    .item-description {
      margin-top: 7px;
      color: #475569;
      font-size: 10.5px;
      line-height: 1.65;
      white-space: pre-line;
    }

    .education-item .item-company {
      color: #475569;
    }

    .skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .skill-pill {
      border: 1px solid #cbd5e1;
      color: #334155;
      padding: 5px 9px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 600;
    }

    .languages-text {
      color: #475569;
      font-size: 11px;
      line-height: 1.6;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 11px 18px;
    }

    .category-field {
      border-left: 2px solid #2563eb;
      padding-left: 10px;
    }

    .category-label {
      font-size: 9px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .category-value {
      font-size: 10.5px;
      color: #334155;
      line-height: 1.5;
      white-space: pre-line;
    }

    /* =========================
       SIDEBAR TEMPLATE
    ========================= */

    .template-sidebar {
      display: grid;
      grid-template-columns: 235px 1fr;
      min-height: 1123px;
    }

    .template-sidebar .side {
      background: #0f172a;
      color: white;
      padding: 46px 28px;
    }

    .template-sidebar .main {
      padding: 46px 38px;
    }

    .template-sidebar .side .cv-name {
      color: white;
      font-size: 26px;
    }

    .template-sidebar .side .cv-title {
      color: #93c5fd;
      font-size: 12px;
      line-height: 1.5;
    }

    .template-sidebar .side .contact-row {
      display: block;
      margin-top: 28px;
      color: #cbd5e1;
    }

    .template-sidebar .side .contact-item {
      display: flex;
      margin-bottom: 11px;
      line-height: 1.4;
    }

    .template-sidebar .side .contact-icon {
      color: #93c5fd;
    }

    .template-sidebar .side .side-section {
      margin-top: 30px;
    }

    .template-sidebar .side h3 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin: 0 0 12px;
      color: #ffffff;
    }

    .template-sidebar .side .skill-pill {
      border-color: #475569;
      color: #e2e8f0;
      margin-bottom: 6px;
    }

    .template-sidebar .main .cv-header {
      border-bottom: 2px solid #2563eb;
    }

    /* =========================
       EXECUTIVE TEMPLATE
    ========================= */

    .template-executive .cv-content {
      padding: 58px 62px;
    }

    .template-executive .cv-header {
      border-bottom: 3px solid #0f172a;
      padding-bottom: 24px;
    }

    .template-executive .cv-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 38px;
      letter-spacing: -0.5px;
    }

    .template-executive .cv-title {
      color: #475569;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-size: 11px;
    }

    .template-executive .section-heading h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      letter-spacing: 0.8px;
    }

    .template-executive .section-line {
      background: #94a3b8;
    }

    /* =========================
       CREATIVE TEMPLATE
    ========================= */

    .template-creative .cv-content {
      padding: 42px 50px;
    }

    .template-creative .cv-header {
      border-bottom: 0;
      background: #f8fafc;
      padding: 30px;
      border-radius: 8px;
      border-left: 6px solid #2563eb;
    }

    .template-creative .cv-name {
      font-size: 36px;
    }

    .template-creative .section-heading h2 {
      color: #2563eb;
    }

    .template-creative .skill-pill {
      border: 0;
      background: #eff6ff;
      color: #1d4ed8;
    }

    /* =========================
       TECH TEMPLATE
    ========================= */

    .template-tech .cv-content {
      padding: 44px 52px;
    }

    .template-tech .cv-header {
      border-bottom: 2px solid #0f172a;
    }

    .template-tech .cv-name {
      font-family: "Courier New", monospace;
      font-size: 31px;
    }

    .template-tech .cv-title {
      font-family: "Courier New", monospace;
      color: #16a34a;
    }

    .template-tech .section-heading h2 {
      font-family: "Courier New", monospace;
      color: #0f172a;
    }

    .template-tech .section-heading::before {
      content: ">";
      color: #16a34a;
      font-weight: 900;
    }

    .template-tech .skill-pill {
      font-family: "Courier New", monospace;
      border-color: #bbf7d0;
      background: #f0fdf4;
    }

    /* =========================
       MINIMAL ATS
    ========================= */

    .template-minimal .cv-content {
      padding: 50px 55px;
    }

    .template-minimal .cv-header {
      border-bottom: 1px solid #0f172a;
    }

    .template-minimal .cv-name {
      font-size: 31px;
    }

    .template-minimal .cv-title {
      color: #334155;
      font-weight: 600;
    }

    .template-minimal .section-heading {
      margin-bottom: 10px;
    }

    .template-minimal .section-heading h2 {
      color: #0f172a;
      letter-spacing: 0.8px;
    }

    .template-minimal .section-line {
      display: none;
    }

    .template-minimal .category-field {
      border-left: 0;
      padding-left: 0;
    }

    /* =========================
       CORPORATE TEMPLATE
    ========================= */

    .template-corporate .cv-content {
      padding: 48px 55px;
    }

    .template-corporate .cv-header {
      background: #f8fafc;
      padding: 25px;
      border-bottom: 3px solid #1e3a8a;
    }

    .template-corporate .cv-name {
      color: #172554;
      font-size: 34px;
    }

    .template-corporate .cv-title {
      color: #1e3a8a;
    }

    .template-corporate .section-heading h2 {
      color: #1e3a8a;
    }

    .template-corporate .section-line {
      background: #bfdbfe;
    }

    .template-corporate .category-field {
      border-left-color: #1e3a8a;
    }

    /* =========================
       PRINT
    ========================= */

    @media print {

      body {
        background: white;
      }

      .topbar,
      .page-heading,
      .status,
      .no-print {
        display: none !important;
      }

      .page-wrapper {
        padding: 0;
        max-width: none;
      }

      .cv-stage {
        padding: 0;
        overflow: visible;
      }

      #cvDocument {
        box-shadow: none;
        margin: 0;
      }
    }

    @media (max-width: 850px) {

      .topbar {
        padding: 0 14px;
      }

      .brand {
        font-size: 18px;
      }

      .action-btn {
        padding: 0 10px;
      }

      .page-wrapper {
        padding: 22px 10px 50px;
      }

      .page-heading {
        align-items: flex-start;
        flex-direction: column;
      }

      .badges {
        justify-content: flex-start;
      }

      .cv-stage {
        justify-content: flex-start;
      }
    }
  </style>
</head>

<body>

  <header class="topbar no-print">

    <div class="brand">
      CV<span>Builder</span>
    </div>

    <div class="actions">
      <button class="action-btn" id="backDashboard">
        Dashboard
      </button>

      <button class="action-btn" id="editCV">
        Edit CV
      </button>

      <button class="action-btn primary" id="saveCV">
        Save CV
      </button>

      <button class="action-btn primary" id="downloadPDF">
        Download PDF
      </button>
    </div>

  </header>

  <main class="page-wrapper">

    <div class="page-heading no-print">

      <div>
        <h1>Professional CV Preview</h1>
        <p>
          Review your CV before saving or downloading it.
        </p>
      </div>

      <div class="badges">
        <span class="badge" id="categoryBadge">Category</span>
        <span class="badge" id="templateBadge">Template</span>
      </div>

    </div>

    <div class="status no-print" id="statusMessage"></div>

    <div class="cv-stage">

      <article id="cvDocument">
        <div id="cvContent"></div>
      </article>

    </div>

  </main>

  <script type="module">

    import {
      auth,
      db
    } from "./firebase-config.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
      collection,
      addDoc,
      setDoc,
      doc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

    const $ = id => document.getElementById(id);

    let currentUser = null;
    let cvData = null;
    let savedFirestoreId = null;

    const categoryNames = {
      IT: "IT / Software",
      Business: "Business",
      Banking: "Banking & Finance",
      Medical: "Medical",
      Teaching: "Teaching",
      Design: "Graphic Design",
      Engineering: "Engineering",
      Student: "Student / Fresh Graduate",
      Marketing: "Marketing & Sales",
      Other: "Other"
    };

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

    function getData() {

      const raw =
        localStorage.getItem("currentCV");

      if (!raw) {
        return null;
      }

      try {
        return JSON.parse(raw);
      } catch {
        return null;
      }

    }

    function showStatus(message, type = "success") {

      const box = $("statusMessage");

      box.textContent = message;
      box.className = `status show ${type}`;

      setTimeout(() => {
        box.className = "status";
      }, 4500);

    }

    function cleanValue(value) {

      if (
        value === undefined ||
        value === null
      ) {
        return "";
      }

      return String(value).trim();

    }

    function section(title, content) {

      if (!content) {
        return "";
      }

      return `
        <section class="section">

          <div class="section-heading">
            <h2>${escapeHTML(title)}</h2>
            <div class="section-line"></div>
          </div>

          ${content}

        </section>
      `;

    }

    function renderContacts(data, sidebar = false) {

      const items = [];

      if (data.email) {
        items.push(`
          <div class="contact-item">
            <span class="contact-icon">@</span>
            <span>${escapeHTML(data.email)}</span>
          </div>
        `);
      }

      if (data.phone) {
        items.push(`
          <div class="contact-item">
            <span class="contact-icon">☎</span>
            <span>${escapeHTML(data.phone)}</span>
          </div>
        `);
      }

      if (data.location) {
        items.push(`
          <div class="contact-item">
            <span class="contact-icon">⌖</span>
            <span>${escapeHTML(data.location)}</span>
          </div>
        `);
      }

      if (data.website) {
        items.push(`
          <div class="contact-item">
            <span class="contact-icon">↗</span>
            <span>${escapeHTML(data.website)}</span>
          </div>
        `);
      }

      if (!items.length) {
        return "";
      }

      return `
        <div class="contact-row">
          ${items.join("")}
        </div>
      `;

    }

    function renderExperience(experience) {

      if (!Array.isArray(experience)) {
        return "";
      }

      const valid = experience.filter(item =>
        item &&
        (
          cleanValue(item.job) ||
          cleanValue(item.company) ||
          cleanValue(item.date) ||
          cleanValue(item.description)
        )
      );

      if (!valid.length) {
        return "";
      }

      return valid.map(item => `
        <div class="experience-item">

          <div class="item-top">

            <div>
              <h3 class="item-title">
                ${escapeHTML(item.job)}
              </h3>

              ${
                item.company
                  ? `<div class="item-company">${escapeHTML(item.company)}</div>`
                  : ""
              }

            </div>

            ${
              item.date
                ? `<div class="item-date">${escapeHTML(item.date)}</div>`
                : ""
            }

          </div>

          ${
            item.description
              ? `<div class="item-description">${escapeHTML(item.description)}</div>`
              : ""
          }

        </div>
      `).join("");

    }

    function renderEducation(education) {

      if (!Array.isArray(education)) {
        return "";
      }

      const valid = education.filter(item =>
        item &&
        (
          cleanValue(item.degree) ||
          cleanValue(item.institute) ||
          cleanValue(item.date)
        )
      );

      if (!valid.length) {
        return "";
      }

      return valid.map(item => `
        <div class="education-item">

          <div class="item-top">

            <div>
              <h3 class="item-title">
                ${escapeHTML(item.degree)}
              </h3>

              ${
                item.institute
                  ? `<div class="item-company">${escapeHTML(item.institute)}</div>`
                  : ""
              }

            </div>

            ${
              item.date
                ? `<div class="item-date">${escapeHTML(item.date)}</div>`
                : ""
            }

          </div>

        </div>
      `).join("");

    }

    function renderSkills(skills) {

      if (!skills) {
        return "";
      }

      const list = String(skills)
        .split(/[,;\n]+/)
        .map(x => x.trim())
        .filter(Boolean);

      if (!list.length) {
        return "";
      }

      return `
        <div class="skills-list">
          ${list.map(skill => `
            <span class="skill-pill">
              ${escapeHTML(skill)}
            </span>
          `).join("")}
        </div>
      `;

    }

    function getCategoryFields(data) {

      const ignored = new Set([
        "category",
        "template",
        "fullName",
        "professionalTitle",
        "email",
        "phone",
        "location",
        "website",
        "summary",
        "skills",
        "languages",
        "experience",
        "education",
        "createdAt",
        "updatedAt",
        "firestoreId"
      ]);

      const labels = {
        programming: "Programming Languages",
        frameworks: "Frameworks & Tools",
        github: "GitHub / Portfolio",
        technicalLevel: "Technical Level",
        projects: "Technical Projects",

        businessArea: "Business Area",
        industry: "Industry",
        leadership: "Leadership Experience",
        managementSkills: "Management Skills",

        financeSkills: "Finance Skills",
        bankingExperience: "Banking Experience",
        accountingSoftware: "Accounting Software",
        financeCertifications: "Finance Certifications",

        medicalQualification: "Medical Qualification",
        specialization: "Specialization",
        clinicalExperience: "Clinical Experience",
        medicalCertifications: "Medical Certifications",

        subjects: "Subjects",
        teachingLevel: "Teaching Level",
        teachingExperience: "Teaching Experience",
        teachingCertifications: "Teaching Certifications",

        designSoftware: "Design Software",
        designSpecialization: "Design Specialization",
        portfolio: "Portfolio",
        creativeSkills: "Creative Skills",

        engineeringDiscipline: "Engineering Discipline",
        engineeringSoftware: "Engineering Software",
        engineeringSkills: "Engineering Skills",
        engineeringProjects: "Engineering Projects",

        studyField: "Field of Study",
        graduationYear: "Graduation Year",
        achievement: "Achievements",
        internship: "Internship",
        studentProjects: "Student Projects",

        marketingSkills: "Marketing Skills",
        salesExperience: "Sales Experience",
        digitalPlatforms: "Digital Platforms",
        campaignExperience: "Campaign Experience",

        professionalField: "Professional Field",
        professionalSkills: "Professional Skills",
        certifications: "Certifications",
        achievements: "Achievements"
      };

      const fields = [];

      Object.entries(data).forEach(([key, value]) => {

        if (
          ignored.has(key) ||
          !labels[key] ||
          !cleanValue(value)
        ) {
          return;
        }

        fields.push({
          label: labels[key],
          value: value
        });

      });

      if (!fields.length) {
        return "";
      }

      return fields.map(field => `
        <div class="category-field">

          <div class="category-label">
            ${escapeHTML(field.label)}
          </div>

          <div class="category-value">
            ${escapeHTML(field.value)}
          </div>

        </div>
      `).join("");

    }

    function renderStandard(data, templateClass) {

      const experienceHTML =
        renderExperience(data.experience);

      const educationHTML =
        renderEducation(data.education);

      const categoryHTML =
        getCategoryFields(data);

      return `
        <div class="${templateClass}">

          <div class="cv-content">

            <header class="cv-header">

              <h1 class="cv-name">
                ${escapeHTML(data.fullName || "Your Name")}
              </h1>

              <div class="cv-title">
                ${escapeHTML(
                  data.professionalTitle ||
                  "Professional"
                )}
              </div>

              ${renderContacts(data)}

            </header>

            ${
              data.summary
                ? section(
                    "Professional Summary",
                    `<div class="summary">${escapeHTML(data.summary)}</div>`
                  )
                : ""
            }

            ${
              categoryHTML
                ? section(
                    categoryNames[data.category] || "Professional Information",
                    `<div class="category-grid">${categoryHTML}</div>`
                  )
                : ""
            }

            ${
              experienceHTML
                ? section(
                    "Professional Experience",
                    experienceHTML
                  )
                : ""
            }

            ${
              educationHTML
                ? section(
                    "Education",
                    educationHTML
                  )
                : ""
            }

            ${
              data.skills
                ? section(
                    "Skills",
                    renderSkills(data.skills)
                  )
                : ""
            }

            ${
              data.languages
                ? section(
                    "Languages",
                    `<div class="languages-text">${escapeHTML(data.languages)}</div>`
                  )
                : ""
            }

          </div>

        </div>
      `;

    }

    function renderSidebar(data) {

      const categoryHTML =
        getCategoryFields(data);

      const experienceHTML =
        renderExperience(data.experience);

      const educationHTML =
        renderEducation(data.education);

      return `
        <div class="template-sidebar">

          <aside class="side">

            <h1 class="cv-name">
              ${escapeHTML(data.fullName || "Your Name")}
            </h1>

            <div class="cv-title">
              ${escapeHTML(
                data.professionalTitle ||
                "Professional"
              )}
            </div>

            ${renderContacts(data, true)}

            ${
              data.skills
                ? `
                  <div class="side-section">

                    <h3>Skills</h3>

                    ${renderSkills(data.skills)}

                  </div>
                `
                : ""
            }

            ${
              data.languages
                ? `
                  <div class="side-section">

                    <h3>Languages</h3>

                    <div style="
                      color:#cbd5e1;
                      font-size:10px;
                      line-height:1.6;
                    ">
                      ${escapeHTML(data.languages)}
                    </div>

                  </div>
                `
                : ""
            }

          </aside>

          <main class="main">

            ${
              data.summary
                ? section(
                    "Professional Summary",
                    `<div class="summary">${escapeHTML(data.summary)}</div>`
                  )
                : ""
            }

            ${
              categoryHTML
                ? section(
                    categoryNames[data.category] || "Professional Information",
                    `<div class="category-grid">${categoryHTML}</div>`
                  )
                : ""
            }

            ${
              experienceHTML
                ? section(
                    "Professional Experience",
                    experienceHTML
                  )
                : ""
            }

            ${
              educationHTML
                ? section(
                    "Education",
                    educationHTML
                  )
                : ""
            }

          </main>

        </div>
      `;

    }

    function renderCV() {

      cvData = getData();

      if (!cvData) {

        $("cvContent").innerHTML = `
          <div style="
            padding:60px;
            text-align:center;
            color:#64748b;
          ">
            <h2>No CV data found</h2>
            <p>Please return to the CV form and complete your information.</p>
          </div>
        `;

        return;
      }

      const category =
        cvData.category || "Other";

      const template =
        cvData.template || "General Professional";

      $("categoryBadge").textContent =
        categoryNames[category] || category;

      $("templateBadge").textContent =
        template;

      let templateClass = "template-minimal";

      if (
        template.toLowerCase().includes("software") ||
        template.toLowerCase().includes("tech") ||
        template.toLowerCase().includes("developer") ||
        category === "IT"
      ) {
        templateClass = "template-tech";
      }

      if (
        template.toLowerCase().includes("executive") ||
        template.toLowerCase().includes("senior") ||
        template.toLowerCase().includes("leadership")
      ) {
        templateClass = "template-executive";
      }

      if (
        template.toLowerCase().includes("creative") ||
        template.toLowerCase().includes("designer") ||
        template.toLowerCase().includes("digital")
      ) {
        templateClass = "template-creative";
      }

      if (
        template.toLowerCase().includes("corporate") ||
        template.toLowerCase().includes("banking") ||
        template.toLowerCase().includes("finance") ||
        template.toLowerCase().includes("medical") ||
        template.toLowerCase().includes("healthcare") ||
        template.toLowerCase().includes("teacher") ||
        template.toLowerCase().includes("educator") ||
        template.toLowerCase().includes("engineer")
      ) {
        templateClass = "template-corporate";
      }

      if (
        template.toLowerCase().includes("modern") ||
        template.toLowerCase().includes("professional") &&
        !template.toLowerCase().includes("ats")
      ) {
        if (
          template.toLowerCase().includes("modern") &&
          !template.toLowerCase().includes("minimal")
        ) {
          templateClass = "template-sidebar";
        }
      }

      if (
        template.toLowerCase().includes("ats") ||
        template.toLowerCase().includes("minimal") ||
        template.toLowerCase().includes("graduate") ||
        template.toLowerCase().includes("student")
      ) {
        templateClass = "template-minimal";
      }

      const useSidebar =
        templateClass === "template-sidebar";

      $("cvContent").innerHTML =
        useSidebar
          ? renderSidebar(cvData)
          : renderStandard(cvData, templateClass);

    }

    async function saveCV() {

      if (!currentUser) {
        showStatus(
          "Please login before saving your CV.",
          "error"
        );
        return;
      }

      if (!cvData) {
        showStatus(
          "No CV data is available.",
          "error"
        );
        return;
      }

      const button = $("saveCV");

      button.disabled = true;
      button.textContent = "Saving...";

      try {

        const dataToSave = {
          ...cvData,
          updatedAt: serverTimestamp()
        };

        delete dataToSave.firestoreId;

        if (savedFirestoreId) {

          await setDoc(
            doc(
              db,
              "users",
              currentUser.uid,
              "cvs",
              savedFirestoreId
            ),
            dataToSave,
            { merge: true }
          );

        } else {

          const ref = await addDoc(
            collection(
              db,
              "users",
              currentUser.uid,
              "cvs"
            ),
            {
              ...dataToSave,
              createdAt:
                cvData.createdAt ||
                serverTimestamp()
            }
          );

          savedFirestoreId = ref.id;

        }

        cvData.firestoreId =
          savedFirestoreId;

        localStorage.setItem(
          "currentCV",
          JSON.stringify(cvData)
        );

        showStatus(
          "CV saved successfully to your account.",
          "success"
        );

      } catch (error) {

        console.error(error);

        showStatus(
          "Unable to save your CV. Please check your Firebase Firestore configuration.",
          "error"
        );

      } finally {

        button.disabled = false;
        button.textContent = "Save CV";

      }

    }

    async function downloadPDF() {

      if (!cvData) {
        showStatus(
          "No CV data is available.",
          "error"
        );
        return;
      }

      const button = $("downloadPDF");

      button.disabled = true;
      button.textContent = "Preparing PDF...";

      try {

        if (!window.html2pdf) {

          await new Promise((resolve, reject) => {

            const script =
              document.createElement("script");

            script.src =
              "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";

            script.onload = resolve;
            script.onerror = reject;

            document.head.appendChild(script);

          });

        }

        const name =
          (cvData.fullName || "Professional-CV")
            .replace(/[^a-z0-9]/gi, "-")
            .replace(/-+/g, "-")
            .replace(/^-|-$/g, "");

        const element =
          $("cvDocument");

        const options = {
          margin: 0,
          filename: `${name}-CV.pdf`,
          image: {
            type: "jpeg",
            quality: 0.98
          },
          html2canvas: {
            scale: 2,
            useCORS: true,
            backgroundColor: "#ffffff"
          },
          jsPDF: {
            unit: "mm",
            format: "a4",
            orientation: "portrait"
          },
          pagebreak: {
            mode: [
              "css",
              "legacy"
            ]
          }
        };

        await window.html2pdf()
          .set(options)
          .from(element)
          .save();

        showStatus(
          "Your professional CV PDF has been generated.",
          "success"
        );

      } catch (error) {

        console.error(error);

        showStatus(
          "PDF generation failed. Please try again.",
          "error"
        );

      } finally {

        button.disabled = false;
        button.textContent = "Download PDF";

      }

    }

    $("backDashboard").addEventListener(
      "click",
      () => {
        window.location.href = "dashboard.html";
      }
    );

    $("editCV").addEventListener(
      "click",
      () => {
        window.location.href = "cv-form.html";
      }
    );

    $("saveCV").addEventListener(
      "click",
      saveCV
    );

    $("downloadPDF").addEventListener(
      "click",
      downloadPDF
    );

    onAuthStateChanged(
      auth,
      user => {

        currentUser = user;

        if (!user) {

          window.location.href =
            "index.html";

          return;

        }

        renderCV();

        if (cvData?.firestoreId) {
          savedFirestoreId =
            cvData.firestoreId;
        }

      }
    );

  </script>

</body>
</html>
