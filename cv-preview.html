<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CV Preview — CVBuilder</title>
<style>
:root{--p:#2563eb;--ink:#111827;--muted:#64748b;--b:#e2e8f0;--bg:#eef2f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer}.top{height:70px;background:#fff;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:10}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.topin{height:100%;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850;font-size:20px;display:flex;gap:9px;align-items:center;color:#111827;text-decoration:none}.mark{width:36px;height:36px;background:var(--p);color:#fff;border-radius:10px;display:grid;place-items:center;font-size:12px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:750}.primary{background:var(--p);color:#fff}.ghost{background:#fff;border:1px solid var(--b)}main{padding:30px 0 70px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.badge{background:#dbeafe;color:#1d4ed8;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.heading h1{margin:5px 0;font-size:30px}.heading p{color:var(--muted);margin:0}.paper-wrap{display:flex;justify-content:center}.paper{width:794px;min-height:1123px;background:#fff;box-shadow:0 18px 50px rgba(15,23,42,.15);padding:58px 62px}.cv-header{border-bottom:2px solid #111827;padding-bottom:20px}.cv-name{font-size:34px;font-weight:850;letter-spacing:-.7px}.cv-title{font-size:16px;color:var(--p);font-weight:750;margin-top:3px}.contact{font-size:10px;color:#475569;margin-top:10px;line-height:1.8}.section{margin-top:24px}.section-title{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:850;border-bottom:1px solid #dbe2ea;padding-bottom:7px;margin-bottom:12px}.summary{font-size:11px;line-height:1.7;color:#334155}.role-details{display:flex;flex-direction:column;gap:6px}.role-detail{display:grid;grid-template-columns:minmax(125px,34%) 1fr;gap:10px;align-items:start;font-size:10.5px;line-height:1.55}.role-label{font-weight:650;color:#1f2937}.role-value{font-weight:400;color:#334155;white-space:pre-line;overflow-wrap:anywhere}.entry{margin-bottom:15px}.entry-head{display:flex;justify-content:space-between;gap:15px}.entry-title{font-size:12px;font-weight:850}.entry-date{font-size:10px;color:#64748b;white-space:nowrap}.entry-sub{font-size:10px;color:#64748b;margin-top:2px}.entry-desc{font-size:10px;line-height:1.6;margin-top:6px;white-space:pre-line;color:#334155}.project-name{font-size:11px;font-weight:850}.project-tech{font-size:9px;color:#2563eb;margin:2px 0}.skills{font-size:10px;line-height:1.8}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{border:1px solid #dbe2ea;padding:3px 6px;font-size:9px;border-radius:4px}.two{display:grid;grid-template-columns:1fr 1fr;gap:30px}.template-tech .cv-header{border-color:#2563eb}.template-executive .cv-header{text-align:center}.template-executive .contact{text-align:center}.template-creative{border-left:8px solid #334155}.template-minimal .cv-header{border:0}.template-corporate .cv-header{background:#f8fafc;padding:18px;border-bottom:0}.template-global-ats .cv-header{border-bottom:2px solid #111827}.template-global-ats .section-title{letter-spacing:.08em}.template-global-ats .cv-name{font-size:32px}.template-global-ats .contact{max-width:100%;color:#334155}.template-global-ats .role-detail{grid-template-columns:minmax(135px,28%) 1fr}.template-global-ats .section{margin-top:21px}.template-global-ats .paper-note{display:none}.template-global-executive .cv-header{text-align:center;border-bottom:3px solid #111827;padding-bottom:24px}.template-global-executive .contact{text-align:center}.template-global-executive .section-title{border-bottom:0;border-top:1px solid #dbe2ea;padding-top:8px}.template-global-modern .cv-header{border-bottom:3px solid #2563eb}.template-global-modern .section-title{color:#1d4ed8}.template-global-modern .section{margin-top:22px}.template-global-modern .entry{margin-bottom:13px}.template-global-modern .role-label{color:#1d4ed8}.international-note{margin-top:12px;padding:10px 12px;border:1px solid #dbeafe;background:#eff6ff;border-radius:8px;color:#1e40af;font-size:13px;line-height:1.5}.save-status{font-size:12px;color:#15803d;display:none;margin-top:8px}.save-status.show{display:block}@page{size:A4 portrait;margin:0}@media print{.top,.heading,.meta{display:none!important}body{background:#fff!important}.paper{box-shadow:none!important;width:210mm;min-height:297mm;padding:15mm 16mm;margin:0}.paper-wrap{display:block}main{padding:0}.two{display:grid}.international-note{display:none}}@media(max-width:820px){.paper{width:100%;padding:35px;min-height:auto}.heading{align-items:flex-start;flex-direction:column;gap:10px}}@media(max-width:560px){.actions .ghost{display:none}.paper{padding:25px}.cv-name{font-size:28px}.two{grid-template-columns:1fr}}
</style></head>
<body>
<header class="top"><div class="wrap topin"><a class="brand" href="dashboard.html"><span class="mark">CV</span>CVBuilder</a><div class="actions"><button class="btn ghost" id="dashboardButton">Dashboard</button><button class="btn ghost" id="editButton">Edit CV</button><button class="btn ghost" id="atsButton">ATS Check</button><button class="btn ghost" id="tailorButton">Tailor for Job</button><button class="btn primary" id="saveButton">Save CV</button><button class="btn primary" id="downloadButton">Download PDF</button></div></div></header>
<main class="wrap"><div class="meta"><span class="badge" id="categoryBadge">Category</span><span class="badge" id="roleBadge">Role</span><span class="badge" id="templateBadge">Template</span></div><div class="heading"><div><h1>Professional CV Preview</h1><p>Review your CV before saving or downloading it.</p><div class="save-status" id="saveStatus">CV saved successfully.</div></div></div>
<div class="paper-wrap"><article class="paper" id="cvPaper">
<header class="cv-header"><div class="cv-name" id="cvName">Your Name</div><div class="cv-title" id="cvTitle">Professional Title</div><div class="contact" id="contact"></div></header>
<section class="section" id="summarySection"><div class="section-title">Professional Summary</div><div class="summary" id="summary"></div></section>
<section class="section"><div class="section-title" id="profileTitle">Professional Profile</div><div class="role-details" id="roleProfile"></div></section>
<section class="section" id="experienceSection"><div class="section-title">Professional Experience</div><div id="experience"></div></section>
<section class="section" id="projectsSection"><div class="section-title">Projects</div><div id="projects"></div></section>
<section class="section" id="educationSection"><div class="section-title">Education</div><div id="education"></div></section>
<div class="two"><section class="section" id="certSection"><div class="section-title">Certifications</div><div class="summary" id="certifications"></div></section><section class="section" id="achievementSection"><div class="section-title">Key Achievements</div><div class="summary" id="achievements"></div></section></div>
<section class="section" id="skillsSection"><div class="section-title">Skills</div><div class="chips" id="skills"></div></section>
<section class="section" id="languagesSection"><div class="section-title">Languages</div><div class="summary" id="languages"></div></section>
</article></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script type="module">
import {auth,db} from "./firebase-config.js";
import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {addDoc,collection,doc,setDoc} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const $=id=>document.getElementById(id);let data={};try{data=JSON.parse(localStorage.getItem("currentCV")||"{}")}catch{}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function lines(v){return String(v||"").split(/\n/).map(x=>x.trim()).filter(Boolean)}
function roleProfile(){
 const r=(data.role||"").toLowerCase();
 if(/software|developer|cyber|network|data analyst|engineer|it support/.test(r))return "Technical Profile";
 if(/teacher|lecturer|academic|instructional/.test(r))return "Teaching & Academic Profile";
 if(/doctor|nurse|pharmac|medical|healthcare/.test(r))return "Clinical & Healthcare Profile";
 if(/designer|illustrator|creative/.test(r))return "Design & Creative Profile";
 if(/bank|finance|account|audit|compliance/.test(r))return "Finance & Banking Profile";
 if(/marketing|sales|business development/.test(r))return "Marketing & Sales Profile";
 return "Professional Profile";
}
function humanizeKey(key){
 return String(key||"").replace(/([a-z])([A-Z])/g,"$1 $2").replace(/[_-]+/g," ").replace(/\s+/g," ").trim().replace(/\b\w/g,m=>m.toUpperCase());
}
function buildRoleText(){
 const vals=Object.entries(data.roleData||{}).filter(([,v])=>String(v??"").trim());
 if(!vals.length)return `<div class="role-detail"><span class="role-label">Target Role</span><span class="role-value">${esc(data.role||"Professional")}</span></div>`;
 return vals.map(([k,v])=>`<div class="role-detail"><span class="role-label">${esc(humanizeKey(k))}</span><span class="role-value">${esc(v)}</span></div>`).join("");
}
function render(){
 const cls={tech:"template-tech",modern:"template-minimal",classic:"template-minimal",executive:"template-executive",creative:"template-creative",corporate:"template-corporate",global-ats:"template-global-ats",global-executive:"template-global-executive",global-modern:"template-global-modern"}[data.template]||"template-minimal";$("cvPaper").className=`paper ${cls}`;
 $("categoryBadge").textContent=data.category||"Professional";$("roleBadge").textContent=data.role||"General Professional";$("templateBadge").textContent=data.template||"Professional";
 $("cvName").textContent=data.fullName||"Your Name";$("cvTitle").textContent=data.professionalTitle||data.role||"Professional";
 const contacts=[data.email,data.phone,data.location,data.linkedin,data.github,data.website,data.portfolio].filter(Boolean);$("contact").textContent=contacts.join("  |  ");
 $("summary").textContent=data.summary||"";
 $("profileTitle").textContent=roleProfile();$("roleProfile").innerHTML=buildRoleText();
 const exp=$("experience");exp.innerHTML="";(data.experience||[]).forEach(x=>{const d=document.createElement("div");d.className="entry";d.innerHTML=`<div class="entry-head"><div class="entry-title">${esc(x.job)}</div><div class="entry-date">${esc(x.date)}</div></div><div class="entry-sub">${esc(x.company)}${x.location?" · "+esc(x.location):""}</div><div class="entry-desc">${esc(x.description)}</div>`;exp.appendChild(d)});
 $("experienceSection").style.display=(data.experience||[]).length?"block":"none";
 const proj=$("projects");proj.innerHTML="";(data.projects||[]).forEach(x=>{const d=document.createElement("div");d.className="entry";d.innerHTML=`<div class="project-name">${esc(x.name)}</div><div class="project-tech">${esc(x.technologies)}</div><div class="entry-desc">${esc(x.description)}</div>`;proj.appendChild(d)});$("projectsSection").style.display=(data.projects||[]).length?"block":"none";
 const edu=$("education");edu.innerHTML="";(data.education||[]).forEach(x=>{const d=document.createElement("div");d.className="entry";d.innerHTML=`<div class="entry-head"><div class="entry-title">${esc(x.degree)}</div><div class="entry-date">${esc(x.date)}</div></div><div class="entry-sub">${esc(x.institute)}${x.grade?" · "+esc(x.grade):""}</div>`;edu.appendChild(d)});$("educationSection").style.display=(data.education||[]).length?"block":"none";
 $("certifications").innerHTML=lines(data.certifications).map(esc).join("<br>");$("certSection").style.display=data.certifications?"block":"none";
 $("achievements").innerHTML=lines(data.achievements).map(esc).join("<br>");$("achievementSection").style.display=data.achievements?"block":"none";
 $("skills").innerHTML=String(data.skills||"").split(/,|\n/).map(x=>x.trim()).filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join("");$("skillsSection").style.display=data.skills?"block":"none";
 $("languages").innerHTML=lines(data.languages).map(esc).join("<br>");$("languagesSection").style.display=data.languages?"block":"none";
}
$("editButton").onclick=()=>location.href="cv-form.html";$("atsButton").onclick=()=>location.href="ats-checker.html";$("tailorButton").onclick=()=>location.href="job-tailor.html";$("dashboardButton").onclick=()=>location.href="dashboard.html";
$("downloadButton").onclick=()=>{const opt={margin:0,filename:`${(data.fullName||"Professional-CV").replace(/\s+/g,"-")}-CV.pdf`,image:{type:"jpeg",quality:.98},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}};html2pdf().set(opt).from($("cvPaper")).save()};
$("saveButton").onclick=async()=>{const user=auth.currentUser;if(!user){alert("Please login again.");return}const btn=$("saveButton");btn.disabled=true;btn.textContent="Saving...";try{data.updatedAt=new Date().toISOString();if(data.firestoreId){await setDoc(doc(db,"users",user.uid,"cvs",data.firestoreId),data)}else{const ref=await addDoc(collection(db,"users",user.uid,"cvs"),data);data.firestoreId=ref.id}localStorage.setItem("currentCV",JSON.stringify(data));$("saveStatus").classList.add("show");btn.textContent="Saved";setTimeout(()=>{btn.disabled=false;btn.textContent="Save CV"},1300)}catch(e){console.error(e);alert("Could not save the CV. Check your Firebase connection and Firestore rules.");btn.disabled=false;btn.textContent="Save CV"}};
onAuthStateChanged(auth,user=>{if(!user){location.href="index.html";return}render()});
</script></body></html>
