<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CV Preview | CVBuilder</title>

  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eef2f7;
      color: #172033;
      font-family: Arial, Helvetica, sans-serif;
    }

    .preview-page {
      min-height: 100vh;
    }

    /* ================================
       TOP BAR
    ================================= */

    .preview-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid #dfe5ed;
    }

    .preview-nav-inner {
      width: min(1180px, calc(100% - 30px));
      min-height: 70px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      text-decoration: none;
      color: #172033;
      font-size: 22px;
      font-weight: 800;
    }

    .brand span {
      color: #2563eb;
    }

    .nav-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-btn {
      height: 40px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid #dce3ed;
      background: #fff;
      color: #34445a;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
    }

    .nav-btn:hover {
      border-color: #2563eb;
      color: #2563eb;
    }

    .nav-btn.primary {
      border-color: #2563eb;
      background: #2563eb;
      color: #fff;
    }

    .nav-btn.primary:hover {
      background: #1d4ed8;
    }

    /* ================================
       PAGE
    ================================= */

    .preview-container {
      width: min(1180px, calc(100% - 30px));
      margin: auto;
      padding: 30px 0 60px;
    }

    .preview-heading {
      margin-bottom: 20px;
    }

    .preview-heading h1 {
      margin: 0 0 7px;
      font-size: 30px;
      letter-spacing: -.5px;
    }

    .preview-heading p {
      margin: 0;
      color: #748196;
      font-size: 13px;
    }

    .status-message {
      display: none;
      margin-bottom: 15px;
      padding: 12px 15px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 650;
    }

    .status-message.show {
      display: block;
    }

    .status-message.success {
      background: #ecfdf3;
      border: 1px solid #bbf7d0;
      color: #15803d;
    }

    .status-message.error {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #be123c;
    }

    .status-message.info {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
    }

    /* ================================
       BADGES
    ================================= */

    .preview-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .badge {
      padding: 7px 10px;
      border-radius: 20px;
      background: #fff;
      border: 1px solid #dfe5ed;
      color: #536277;
      font-size: 11px;
      font-weight: 750;
    }

    /* ================================
       CV PAPER
    ================================= */

    .cv-wrapper {
      display: flex;
      justify-content: center;
    }

    #cvDocument {
      width: 210mm;
      min-height: 297mm;
      background: #fff;
      box-shadow: 0 15px 45px rgba(20,35,60,.16);
      overflow: hidden;
      color: #263347;
    }

    .cv-inner {
      min-height: 297mm;
      padding: 18mm 18mm 16mm;
    }

    /* ================================
       CV HEADER
    ================================= */

    .cv-header {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      padding-bottom: 18px;
      border-bottom: 2px solid #e5eaf1;
    }

    .cv-avatar {
      width: 76px;
      height: 76px;
      flex: 0 0 76px;
      border-radius: 50%;
      background: #eff6ff;
      color: #2563eb;
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 800;
    }

    .cv-header-main {
      flex: 1;
      min-width: 0;
    }

    .cv-name {
      margin: 0 0 5px;
      color: #172033;
      font-size: 30px;
      line-height: 1.1;
      font-weight: 800;
    }

    .cv-title {
      margin: 0;
      color: #2563eb;
      font-size: 15px;
      font-weight: 700;
    }

    .cv-contact {
      margin-top: 13px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 15px;
      color: #617086;
      font-size: 10px;
    }

    .contact-item {
      display: none;
    }

    .contact-item.show {
      display: inline;
    }

    /* ================================
       SECTIONS
    ================================= */

    .cv-section {
      margin-top: 22px;
    }

    .cv-section-title {
      margin: 0 0 9px;
      color: #172033;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      font-weight: 800;
    }

    .cv-section-title::after {
      content: "";
      display: block;
      width: 32px;
      height: 2px;
      margin-top: 5px;
      background: #2563eb;
    }

    .cv-summary {
      margin: 0;
      color: #526176;
      font-size: 10.5px;
      line-height: 1.65;
      white-space: pre-line;
    }

    /* ================================
       CATEGORY INFORMATION
    ================================= */

    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 9px 20px;
    }

    .category-item {
      padding-bottom: 7px;
      border-bottom: 1px solid #edf0f4;
    }

    .category-label {
      color: #718096;
      font-size: 8.5px;
      text-transform: uppercase;
      letter-spacing: .6px;
      font-weight: 800;
      margin-bottom: 3px;
    }

    .category-value {
      color: #35445a;
      font-size: 10px;
      line-height: 1.5;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    /* ================================
       EXPERIENCE / EDUCATION
    ================================= */

    .timeline-item {
      position: relative;
      padding-left: 15px;
      margin-bottom: 17px;
      border-left: 2px solid #e5eaf1;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -5px;
      top: 3px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2563eb;
    }

    .timeline-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .timeline-title {
      color: #243247;
      font-size: 11px;
      font-weight: 800;
    }

    .timeline-company {
      margin-top: 2px;
      color: #2563eb;
      font-size: 9.5px;
      font-weight: 700;
    }

    .timeline-date {
      color: #78869a;
      font-size: 8.5px;
      text-align: right;
      white-space: nowrap;
    }

    .timeline-description {
      margin-top: 7px;
      color: #59687d;
      font-size: 9.5px;
      line-height: 1.55;
      white-space: pre-line;
    }

    /* ================================
       SKILLS
    ================================= */

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .skill-tag {
      padding: 5px 8px;
      border-radius: 5px;
      background: #eff6ff;
      color: #2455a4;
      font-size: 8.5px;
      font-weight: 700;
    }

    .language-tag {
      padding: 5px 8px;
      border-radius: 5px;
      background: #f4f6f8;
      color: #536277;
      font-size: 8.5px;
      font-weight: 700;
    }

    .skills-language-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    /* ================================
       TEMPLATE STYLES
    ================================= */

    .template-modern-tech .cv-header {
      border-bottom-color: #2563eb;
    }

    .template-modern-tech .cv-name {
      color: #172033;
    }

    .template-modern-tech .cv-section-title::after {
      background: #2563eb;
    }


    .template-creative .cv-inner {
      padding-top: 0;
    }

    .template-creative .cv-header {
      margin: 0 -18mm;
      padding: 18mm;
      background: #172033;
      border-bottom: 0;
    }

    .template-creative .cv-name,
    .template-creative .cv-title {
      color: #fff;
    }

    .template-creative .cv-contact {
      color: #cbd5e1;
    }

    .template-creative .cv-avatar {
      background: rgba(255,255,255,.12);
      color: #fff;
    }

    .template-corporate .cv-header {
      border-bottom: 4px solid #172033;
    }

    .template-corporate .cv-section-title::after {
      background: #172033;
    }

    .template-academic .cv-name {
      font-family: Georgia, serif;
    }

    .template-academic .cv-header {
      border-bottom: 1px solid #172033;
    }

    .template-academic .cv-section-title {
      font-family: Georgia, serif;
    }

    .template-minimal .cv-header {
      border-bottom: 1px solid #dfe5ed;
    }

    .template-minimal .cv-section-title::after {
      width: 18px;
      background: #64748b;
    }

    .template-ats .cv-avatar {
      display: none;
    }

    .template-ats .cv-header {
      display: block;
      border-bottom: 1px solid #172033;
    }

    .template-ats .cv-contact {
      margin-top: 8px;
    }

    /* ================================
       EMPTY STATE
    ================================= */

    .empty-value {
      color: #9aa5b5;
      font-style: italic;
    }

    /* ================================
       LOADING
    ================================= */

    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(255,255,255,.96);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-screen.hidden {
      display: none;
    }

    .loading-box {
      text-align: center;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid #dbe5f3;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 12px;
    }

    .loading-box p {
      margin: 0;
      color: #627188;
      font-size: 13px;
      font-weight: 650;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ================================
       RESPONSIVE
    ================================= */

    @media (max-width: 850px) {

      #cvDocument {
        transform-origin: top center;
        width: 210mm;
      }

      .cv-wrapper {
        overflow-x: auto;
        justify-content: flex-start;
        padding-bottom: 20px;
      }

      .preview-container {
        width: calc(100% - 20px);
      }

    }

    @media (max-width: 600px) {

      .preview-nav-inner {
        min-height: 62px;
      }

      .brand {
        font-size: 19px;
      }

      .nav-actions {
        gap: 5px;
      }

      .nav-btn {
        padding: 0 9px;
        font-size: 10px;
      }

      .preview-heading h1 {
        font-size: 24px;
      }

      .cv-wrapper {
        padding-left: 0;
        padding-right: 0;
      }

    }

    /* ================================
       PRINT
    ================================= */

    @media print {

      body {
        background: #fff;
      }

      .preview-nav,
      .preview-heading,
      .preview-meta,
      .status-message {
        display: none !important;
      }

      .preview-container {
        width: 100%;
        padding: 0;
        margin: 0;
      }

      .cv-wrapper {
        display: block;
      }

      #cvDocument {
        width: 210mm;
        min-height: 297mm;
        box-shadow: none;
        margin: 0;
      }

    }
  </style>
</head>

<body>

  <!-- LOADING -->
  <div

      <p id="loadingText">

  </div>


  <!-- NAVIGATION -->

  <main class="preview-page">

        <span

          Template
        </span>

      <!-- CV -->
      <div class="cv-wrapper">

          <div class="cv-inner">


            <!-- HEADER -->
            <header class="cv-header">

              <div

              <div class="cv-header-main">

                  <span

                  <span
                    id="phoneRow"

                  <span

                    <span id="cvLocation"></span>

                  </span>


                  <span

                    class="contact-item">

                    <span id="cvWebsite"></span>

                  </span>

                </div>

              </div>

            </header>


            <!-- SUMMARY -->
            <section
              id="summarySection"
              class="cv-section">

              <h2 class="cv-section-title">
                Professional Summary
              </h2>

              <p
                id="cvSummary"
                class="cv-summary">
              </p>

            </section>


            <!-- CATEGORY -->
            <section
              id="categorySection"
              class="cv-section">

              <h2
                id="categoryContentTitle"
                class="cv-section-title">
                Professional Information
              </h2>

              <div
                id="categoryContent"
                class="category-grid">
              </div>

            </section>


            <!-- EXPERIENCE -->
            <section
              id="experienceSection"
              class="cv-section">

              <h2 class="cv-section-title">
                Work Experience
              </h2>

              <div
                id="cvExperience">
              </div>

            </section>


            <!-- EDUCATION -->
            <section
              id="educationSection"
              class="cv-section">

              <h2 class="cv-section-title">
                Education
              </h2>

              <div
                id="cvEducation">
              </div>

            </section>


            <!-- SKILLS / LANGUAGES -->
            <section
              id="skillsSection"

              <div class="skills-language-grid">

                  <h2 class="cv-section-title">

                <div>

        </article>

      </div>

    </div>

  </main>


  <script type="module">

    /* =========================================
       FIREBASE
    ========================================= */

    import {
      auth,
      db
    } from "./firebase-config.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
      collection,
      addDoc,
      setDoc,
      doc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    /* =========================================
       ELEMENTS
    ========================================= */

    const loading =
      document.getElementById("loading");

    const loadingText =
      document.getElementById("loadingText");

    const statusMessage =
      document.getElementById("statusMessage");

    const cvDocument =
      document.getElementById("cvDocument");

    const saveButton =
      document.getElementById("saveCV");

    const downloadButton =
      document.getElementById("downloadPDF");


    /* =========================================
       CATEGORY NAMES
    ========================================= */

    const categoryNames = {

      IT:
        "IT / Software",

      Business:
        "Business",

      Banking:
        "Banking & Finance",

      Medical:
        "Medical",

      Teaching:
        "Teaching",

      Design:
        "Graphic Design",

      Engineering:
        "Engineering",

      Student:
        "Student / Fresh Graduate",

      Marketing:
        "Marketing & Sales",

      Other:
        "Other"

    };


    /* =========================================
       CATEGORY FIELD LABELS
    ========================================= */

    const categoryLabels = {

      programming:
        "Programming Languages",

      frameworks:
        "Frameworks & Technologies",

      github:
        "GitHub / Code Profile",

      technicalLevel:
        "Technical Level",

      projects:
        "Key Projects",


      businessArea:
        "Business Area",

      leadership:
        "Leadership Experience",

      industry:
        "Industry",

      managementSkills:
        "Management Skills",


      financeSkills:
        "Finance Skills",

      bankingExperience:
        "Banking Experience",

      accountingSoftware:
        "Accounting / Finance Software",

      financeCertifications:
        "Finance Certifications",


      medicalQualification:
        "Medical Qualification",

      specialization:
        "Specialization",

      clinicalExperience:
        "Clinical Experience",

      medicalCertifications:
        "Medical Certifications",


      subjects:
        "Subjects",

      teachingLevel:
        "Teaching Level",

      teachingExperience:
        "Teaching Experience",

      teachingCertifications:
        "Teaching Certifications",


      designSoftware:
        "Design Software",

      designSpecialization:
        "Design Specialization",

      portfolio:
        "Portfolio",

      creativeSkills:
        "Creative Skills",


      engineeringDiscipline:
        "Engineering Discipline",

      engineeringSoftware:
        "Engineering Software",

      engineeringSkills:
        "Engineering Skills",

      engineeringProjects:
        "Engineering Projects",


      studyField:
        "Field of Study",

      graduationYear:
        "Graduation Year",

      achievement:
        "Academic Achievements",

      internship:
        "Internship Experience",

      studentProjects:
        "Academic / Student Projects",


      marketingSkills:
        "Marketing Skills",

      salesExperience:
        "Sales Experience",

      digitalPlatforms:
        "Digital Platforms",

      campaignExperience:
        "Campaign Experience",


      professionalField:
        "Professional Field",

      professionalSkills:
        "Professional Skills",

      certifications:
        "Certifications",

      achievements:
        "Achievements"

    };


    /* =========================================
       CURRENT CV
    ========================================= */

    let currentCV = null;
    let currentUser = null;


    function getCurrentCV() {

      try {

        const raw =
          localStorage.getItem("currentCV");

        if (!raw) {
          return null;
        }

        return JSON.parse(raw);

      } catch (error) {

        console.error(
          "CV data error:",
          error
        );

        return null;

      }

    }


    /* =========================================
       HELPERS
    ========================================= */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function getInitials(name) {

      if (!name) {
        return "CV";
      }

      const words =
        name.trim().split(/\s+/);

      if (words.length === 1) {
        return words[0]
          .substring(0, 2)
          .toUpperCase();
      }

      return (
        words[0][0] +
        words[words.length - 1][0]
      ).toUpperCase();

    }


    function splitList(value) {

      if (!value) {
        return [];
      }

      if (Array.isArray(value)) {
        return value
          .map(item => String(item).trim())
          .filter(Boolean);
      }

      return String(value)
        .split(/[,;\n|]+/)
        .map(item => item.trim())
        .filter(Boolean);

    }


    function sanitizeFilename(name) {

      return String(name || "CV")
        .replace(/[<>:"/\\|?*]+/g, "")
        .replace(/\s+/g, "_")
        .substring(0, 80);

    }


    function showStatus(
      message,
      type = "info"
    ) {

      statusMessage.textContent =
        message;

      statusMessage.className =
        `status-message show ${type}`;

    }


    function hideStatus() {

      statusMessage.textContent =
        "";

      statusMessage.className =
        "status-message";

    }


    /* =========================================
       TEMPLATE CLASS
    ========================================= */

    function applyTemplate(template) {

      cvDocument.className = "";

      const value =
        String(template || "")
          .toLowerCase();

      if (
        value.includes("creative") ||
        value.includes("portfolio") ||
        value.includes("designer")
      ) {

        cvDocument.classList.add(
          "template-creative"
        );

      } else if (
        value.includes("modern") ||
        value.includes("tech")
      ) {

        cvDocument.classList.add(
          "template-modern-tech"
        );

      } else if (
        value.includes("minimal")
      ) {

        cvDocument.classList.add(
          "template-minimal"
        );

      } else if (
        value.includes("corporate") ||
        value.includes("executive") ||
        value.includes("finance") ||
        value.includes("banking")
      ) {

        cvDocument.classList.add(
          "template-corporate"
        );

      } else if (
        value.includes("academic") ||
        value.includes("teacher") ||
        value.includes("educator")
      ) {

        cvDocument.classList.add(
          "template-academic"
        );

      } else if (
        value.includes("ats") ||
        value.includes("technical")
      ) {

        cvDocument.classList.add(
          "template-ats"
        );

      } else {

        cvDocument.classList.add(
          "template-modern-tech"
        );

      }

    }


    /* =========================================
       HEADER
    ========================================= */

    function renderHeader() {

      const name =
        currentCV.fullName ||
        "Your Name";

      const title =
        currentCV.professionalTitle ||
        "Professional Title";


      document.getElementById(
        "cvName"
      ).textContent = name;


      document.getElementById(
        "cvTitle"
      ).textContent = title;


      document.getElementById(
        "cvAvatar"
      ).textContent =
        getInitials(name);


      setContact(
        "emailRow",
        "cvEmail",
        currentCV.email
      );

      setContact(
        "phoneRow",
        "cvPhone",
        currentCV.phone
      );

      setContact(
        "locationRow",
        "cvLocation",
        currentCV.location
      );

      setContact(
        "websiteRow",
        "cvWebsite",
        currentCV.website
      );

    }


    function setContact(
      rowId,
      valueId,
      value
    ) {

      const row =
        document.getElementById(rowId);

      const element =
        document.getElementById(valueId);


      if (value) {

        row.classList.add("show");

        element.textContent =
          value;

      } else {

        row.classList.remove("show");

        element.textContent =
          "";

      }

    }


    /* =========================================
       SUMMARY
    ========================================= */

    function renderSummary() {

      const section =
        document.getElementById(
          "summarySection"
        );

      const summary =
        document.getElementById(
          "cvSummary"
        );


      if (currentCV.summary) {

        section.style.display =
          "block";

        summary.textContent =
          currentCV.summary;

      } else {

        section.style.display =
          "none";

      }

    }


    /* =========================================
       CATEGORY INFORMATION
    ========================================= */

    function renderCategoryInformation() {

      const container =
        document.getElementById(
          "categoryContent"
        );

      const section =
        document.getElementById(
          "categorySection"
        );

      const title =
        document.getElementById(
          "categoryContentTitle"
        );


      container.innerHTML = "";


      title.textContent =
        categoryNames[
          currentCV.category
        ] ||
        "Professional Information";


      const excluded = new Set([

        "category",
        "template",
        "fullName",
        "professionalTitle",
        "email",
        "phone",
        "location",
        "website",
        "summary",
        "skills",
        "languages",
        "experience",
        "education",
        "createdAt",
        "updatedAt",
        "firestoreId"

      ]);


      const entries =
        Object.entries(currentCV)
          .filter(([key, value]) => {

            return (
              !excluded.has(key) &&
              value !== null &&
              value !== undefined &&
              String(value).trim() !== ""
            );

          });


      if (!entries.length) {

        section.style.display =
          "none";

        return;

      }


      section.style.display =
        "block";


      entries.forEach(
        ([key, value]) => {

          const item =
            document.createElement("div");

          item.className =
            "category-item";


          const label =
            document.createElement("div");

          label.className =
            "category-label";

          label.textContent =
            categoryLabels[key] ||
            formatLabel(key);


          const content =
            document.createElement("div");

          content.className =
            "category-value";


          if (
            key === "github" ||
            key === "portfolio" ||
            key === "website"
          ) {

            const link =
              document.createElement("a");

            link.href =
              normalizeURL(value);

            link.target =
              "_blank";

            link.rel =
              "noopener noreferrer";

            link.textContent =
              value;

            link.style.color =
              "#2563eb";

            link.style.textDecoration =
              "none";

            content.appendChild(link);

          } else {

            content.textContent =
              value;

          }


          item.appendChild(label);
          item.appendChild(content);

          container.appendChild(item);

        }
      );

    }


    function formatLabel(key) {

      return String(key)
        .replace(/([A-Z])/g, " $1")
        .replace(/^./, char =>
          char.toUpperCase()
        );

    }


    function normalizeURL(value) {

      const text =
        String(value || "").trim();

      if (
        text.startsWith("http://") ||
        text.startsWith("https://")
      ) {

        return text;

      }

      return "https://" + text;

    }


    /* =========================================
       EXPERIENCE
    ========================================= */

    function renderExperience() {

      const section =
        document.getElementById(
          "experienceSection"
        );

      const container =
        document.getElementById(
          "cvExperience"
        );


      container.innerHTML = "";


      const experience =
        Array.isArray(currentCV.experience)
          ? currentCV.experience
          : [];


      const valid =
        experience.filter(item =>
          item &&
          (
            item.position ||
            item.company ||
            item.date ||
            item.description
          )
        );


      if (!valid.length) {

        section.style.display =
          "none";

        return;

      }


      section.style.display =
        "block";


      valid.forEach(item => {

        const wrapper =
          document.createElement("div");

        wrapper.className =
          "timeline-item";


        const top =
          document.createElement("div");

        top.className =
          "timeline-top";


        const left =
          document.createElement("div");


        if (item.position) {

          const title =
            document.createElement("div");

          title.className =
            "timeline-title";

          title.textContent =
            item.position;

          left.appendChild(title);

        }


        if (item.company) {

          const company =
            document.createElement("div");

          company.className =
            "timeline-company";

          company.textContent =
            item.company;

          left.appendChild(company);

        }


        top.appendChild(left);


        if (item.date) {

          const date =
            document.createElement("div");

          date.className =
            "timeline-date";

          date.textContent =
            item.date;

          top.appendChild(date);

        }


        wrapper.appendChild(top);


        if (item.description) {

          const description =
            document.createElement("div");

          description.className =
            "timeline-description";

          description.textContent =
            item.description;

          wrapper.appendChild(
            description
          );

        }


        container.appendChild(wrapper);

      });

    }

    /* =========================================
       SKILLS
    ========================================= */

    function renderSkills() {

        );

    /* =========================================
       RENDER EVERYTHING
    ========================================= */

    function renderCV() {

      if (!currentCV) {
        return;
      }


      document.getElementById(
        "categoryBadge"
      ).textContent =
        categoryNames[
          currentCV.category
        ] ||
        currentCV.category ||
        "Professional";


      document.getElementById(
        "templateBadge"
      ).textContent =
        currentCV.template ||
        "Professional Template";


      applyTemplate(
        currentCV.template
      );


      renderHeader();

      renderSummary();

      renderCategoryInformation();

      renderExperience();

      renderEducation();

      renderSkills();

    }


    /* =========================================
       SAVE TO FIRESTORE
    ========================================= */

    async function saveCVToFirebase() {

      if (!currentUser) {

        showStatus(
          "Please log in before saving your CV.",
          "error"
        );

        return;

      }


      if (!currentCV) {

        showStatus(
          "No CV data was found.",
          "error"
        );

        return;

      }


      saveButton.disabled =
        true;

      saveButton.textContent =
        "Saving...";


      showStatus(
        "Saving your CV...",
        "info"
      );


      try {

        const userCVCollection =
          collection(
            db,
            "users",
            currentUser.uid,
            "cvs"
          );


        const dataToSave = {
          ...currentCV,

          updatedAt:
            serverTimestamp()

        };


        /*
          Never send firestoreId as a field
          if it is only being used locally.
        */

        delete dataToSave.firestoreId;


        let firestoreId =
          currentCV.firestoreId;


        if (firestoreId) {

          const cvReference =
            doc(
              db,
              "users",
              currentUser.uid,
              "cvs",
              firestoreId
            );


          await setDoc(
            cvReference,
            dataToSave,
            {
              merge: true
            }
          );

        } else {

          const newDocument =
            await addDoc(
              userCVCollection,
              {
                ...dataToSave,

                createdAt:
                  serverTimestamp()
              }
            );


          firestoreId =
            newDocument.id;

        }


        /*
          Keep a local copy for editing.
        */

        currentCV.firestoreId =
          firestoreId;


        localStorage.setItem(
          "currentCV",
          JSON.stringify(currentCV)
        );


        showStatus(
          "Your CV has been saved successfully.",
          "success"
        );


        saveButton.textContent =
          "Saved ✓";


        setTimeout(() => {

          saveButton.textContent =
            "Save CV";

        }, 1800);


      } catch (error) {

        console.error(
          "Save CV error:",
          error
        );


        showStatus(
          getFirebaseErrorMessage(error),
          "error"
        );


        saveButton.textContent =
          "Save CV";

      }


      saveButton.disabled =
        false;

    }


    /* =========================================
       FIREBASE ERROR
    ========================================= */

    function getFirebaseErrorMessage(error) {

      const code =
        error?.code || "";


      switch (code) {

        case "permission-denied":
          return "You do not have permission to save this CV. Please check your Firebase Firestore rules.";

        case "unauthenticated":
          return "Your login session has expired. Please log in again.";

        case "failed-precondition":
          return "Firebase Firestore is not ready. Please check your Firestore database.";

        case "unavailable":
          return "Firebase is temporarily unavailable. Please check your internet connection.";

        default:
          console.error(
            "Firebase error:",
            error
          );

          return "Could not save your CV. Please try again.";

      }

    }

       EDIT CV

    document

    ========================================= */

    ========================================= */

    /* =========================================
       PDF DOWNLOAD
    ========================================= */

    async function downloadPDF() {

      if (!currentCV) {

        showStatus(
          "No CV data is available.",
          "error"
        );

        return;

      }


      downloadButton.disabled =
        true;

      downloadButton.textContent =
        "Preparing PDF...";


      showStatus(
        "Preparing your PDF...",
        "info"
      );


      try {

        /*
          Load html2pdf only when needed.
        */

        if (!window.html2pdf) {

          await loadHTML2PDF();

        }


        const name =
          sanitizeFilename(
            currentCV.fullName ||
            "CV"
          );


        const options = {

          margin: 0,

          filename:
            `${name}_CV.pdf`,

          image: {
            type: "jpeg",
            quality: 0.98
          },

          html2canvas: {
            scale: 2,
            useCORS: true,
            backgroundColor: "#ffffff"
          },

          jsPDF: {
            unit: "mm",
            format: "a4",
            orientation: "portrait"
          },

          pagebreak: {
            mode: [
              "css",
              "legacy"
            ]
          }

        };


        await window
          .html2pdf()
          .set(options)
          .from(cvDocument)
          .save();


        showStatus(
          "PDF downloaded successfully.",
          "success"
        );


      } catch (error) {

        console.error(
          "PDF error:",
          error
        );


        showStatus(
          "Could not generate the PDF. Please try again.",
          "error"
        );

      }


      downloadButton.disabled =
        false;

      downloadButton.textContent =
        "Download PDF";

    }


    function loadHTML2PDF() {

      return new Promise(
        (resolve, reject) => {

          const existing =
            document.querySelector(
              'script[data-html2pdf]'
            );


          if (existing) {

            existing.addEventListener(
              "load",
              resolve
            );

            existing.addEventListener(
              "error",
              reject
            );

            return;

          }


          const script =
            document.createElement("script");

          script.src =
            "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";

          script.dataset.html2pdf =
            "true";

          script.onload =
            resolve;

          script.onerror =
            reject;

          document.head.appendChild(
            script
          );

        }
      );

    }


    downloadButton.addEventListener(
      "click",
      downloadPDF
    );


    /* =========================================
       AUTH STATE
    ========================================= */

    onAuthStateChanged(
      auth,
      user => {

        if (!user) {

          window.location.href =
            "index.html";

          return;

        }


        currentUser =
          user;


        currentCV =
          getCurrentCV();


        if (!currentCV) {

          loadingText.textContent =
            "No CV found. Returning to templates...";


          setTimeout(() => {

            window.location.href =
              "templates.html";

          }, 700);

          return;

        }


        renderCV();


        loading.classList.add(
          "hidden"
        );

      }
    );

  </script>
